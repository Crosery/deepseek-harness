# The dsh-cli-app bundle patch: the terminal surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# Unlike the Web surface, the cli is single-session and composes its agent
# process-wide: every agent-plane row the base ships stays enabled (the
# headless criterion). The host plane below mirrors the Web host rows that
# are not web-specific, and the terminal roster replaces the browser roster.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

# The terminal surface uploads no telemetry, so the OTel exporter SDK stays
# out of the process entirely (a measurable RSS win on the CLI; the web
# surface keeps its default-disabled-but-loaded exporter). A deployment that
# opts into telemetry re-enables this row in a later patch layer.
- id: session-telemetry-otel
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── terminal host rows: the gateway and its in-process carrier ───────────────

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # The API gateway: the transport-agnostic dispatch face every client
    # shape shares. The base layer's agent-default-model service owns the
    # default model.
    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Plain route-registration carrier (no listener is ever bound in the cli;
    # the in-process transport dispatches straight into the composed fetch
    # handler). The connection node half needs its webServer registry for the
    # logical RPC channels model-mounted dual-half packages use.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: '127.0.0.1'
        port: 0

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: client-runtime
      name: '@deepseek-ai/dsh-client-runtime'

    # ── this app ──────────────────────────────────────────────────────────────

    - id: cli-startup
      name: '@deepseek-ai/dsh-cli-app/startup'

    - id: cli-app
      name: '@deepseek-ai/dsh-cli-app'
      inject: [cliStartup]

    # ── terminal plugin roster (dsh.client rows; node halves are empty) ───────

    - id: terminal-connection
      name: '@deepseek-ai/dsh-client-terminal-connection'

    - id: terminal
      name: '@deepseek-ai/dsh-client-terminal'

    - id: terminal-conversation
      name: '@deepseek-ai/dsh-client-terminal-conversation'

    - id: terminal-interaction
      name: '@deepseek-ai/dsh-client-terminal-interaction'

    - id: terminal-tool
      name: '@deepseek-ai/dsh-client-terminal-tool'

    - id: terminal-commands
      name: '@deepseek-ai/dsh-client-terminal-commands'

    - id: terminal-model
      name: '@deepseek-ai/dsh-client-terminal-model'

    - id: terminal-status
      name: '@deepseek-ai/dsh-client-terminal-status'

    - id: terminal-attachment
      name: '@deepseek-ai/dsh-client-terminal-attachment'
